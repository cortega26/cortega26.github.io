name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Rebuild daily at 06:00 UTC so build-time GitHub stats (stars/forks) stay fresh
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6
      - name: Setup Node
        uses: actions/setup-node@ad1b57eb8159e2fd3cc753317dd4a4016287218f # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate GA4 Measurement ID (Plan 006)
        run: |
          if [ -z "${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}" ]; then
            echo "::error::PUBLIC_GA4_MEASUREMENT_ID is not set. Set repository variable vars.PUBLIC_GA4_MEASUREMENT_ID to G-2HK4GHK7GR (Settings → Secrets and variables → Actions → Variables → New repository variable). Measurement ID is not secret — use vars, not secrets. Build fails to avoid deploying without analytics."
            exit 1
          fi
          echo "PUBLIC_GA4_MEASUREMENT_ID is set (${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}) — will be injected into build."
      - name: Type check
        run: npm run check
      - name: Source tests
        run: node tests/run.js
      - name: Build Astro
        run: npm run build
        env:
          # Authenticated GitHub API (1000 req/hr per repo) so scheduled builds
          # don't hit the 60/hr unauthenticated limit and silently fall back to
          # stale committed stats. See scripts/fetch-github-stats.js.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GA4 Measurement ID — public, so vars (not secrets). Injected as
          # PUBLIC_GA4_MEASUREMENT_ID for Astro/Vite (import.meta.env). See Plan 006.
          PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
      - name: Built output tests
        run: node tests/run.js --built
      - name: Install Playwright browser
        # test-htw-snapshot.mjs launches real Chromium, whose binary is not
        # present on a fresh runner (npm ci installs the npm package only).
        # --with-deps also installs the OS libraries headless Chromium needs.
        run: npx playwright install --with-deps chromium
      - name: HTW snapshot
        run: node test-htw-snapshot.mjs
      - name: Link & SEO audit (informational)
        run: node scripts/check-links-seo.js
        continue-on-error: true
      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: seo-audit-report
          path: output/seo-audit-report.md
      - name: CSP hash check (informational)
        run: node scripts/check-csp-hashes.mjs
        continue-on-error: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
