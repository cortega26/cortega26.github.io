name: Support app checks
on:
  pull_request:
    paths: ['support/**', 'package.json', 'package-lock.json', '.github/workflows/support-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Pinned to the @playwright/test lockfile version: browsers and system
    # libraries are preinstalled, so CI does not depend on Ubuntu apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - uses: actions/setup-node@ad1b57eb8159e2fd3cc753317dd4a4016287218f
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Canonical gate: check -> unit -> build -> artifact tests.
      - run: npm run support:verify
      - name: Cloudflare authentication preflight unit tests (offline)
        run: node --test support/tests/cloudflare-auth-preflight.test.mjs
      - name: Verify preinstalled Playwright browsers
        run: |
          node --input-type=module -e '
            import { existsSync } from "node:fs";
            import { chromium, firefox, webkit } from "playwright";
            for (const [name, engine] of Object.entries({ chromium, firefox, webkit })) {
              if (!existsSync(engine.executablePath())) throw new Error(name + " browser missing from CI image");
              console.log(name + " browser executable present");
            }
          '
      # The container runs as root; Firefox requires HOME to be owned by root.
      # GitHub Actions otherwise sets HOME=/github/home (owned by pwuser).
      - name: Support browser E2E
        run: npm run support:e2e
        env:
          HOME: /root
      - name: Support release-mode browser E2E
        run: npm run support:e2e:release
        env:
          HOME: /root
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: support-review
          path: output/support
