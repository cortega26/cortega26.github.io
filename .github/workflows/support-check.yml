name: Support app checks
on:
  pull_request:
    paths: ['support/**', 'package.json', 'package-lock.json', '.github/workflows/support-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - uses: actions/setup-node@ad1b57eb8159e2fd3cc753317dd4a4016287218f
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Canonical gate: check -> unit -> build -> artifact tests.
      - run: npm run support:verify
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run support:e2e
      - run: npm run support:e2e:release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: support-review
          path: output/support
