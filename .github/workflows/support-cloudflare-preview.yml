name: Tooltician Support Cloudflare Preview

on:
  push:
    branches: [master]
    paths:
      - 'support/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/support-cloudflare-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooltician-support-cloudflare-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare deployment configuration
        id: config
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare preview was not deployed. Configure Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then run this workflow manually."
            {
              echo "### Cloudflare preview: not deployed"
              echo "Missing Actions secrets: \`CLOUDFLARE_API_TOKEN\` or \`CLOUDFLARE_ACCOUNT_ID\`."
              echo "Configure them once, then re-run this workflow using **Run workflow**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout verified commit
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@ad1b57eb8159e2fd3cc753317dd4a4016287218f # v6
        with:
          node-version: 24
          cache: npm

      - name: Validate Cloudflare token and Pages project access
        if: steps.config.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node support/scripts/cloudflare-auth-preflight.mjs

      - name: Install project dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci

      - name: Verify support application and build preview
        if: steps.config.outputs.configured == 'true'
        run: npm run support:verify
        env:
          SUPPORT_RELEASE: '0'

      - name: Deploy to the existing Cloudflare Pages preview branch
        if: steps.config.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.142.0 pages deploy support/dist \
            --project-name tooltician-support \
            --branch feat/tooltician-support-v1 \
            --commit-hash "$GITHUB_SHA"

      - name: Verify deployed residents preview
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url='https://feat-tooltician-support-v1.tooltician-support.pages.dev/vecinos/'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --location --retry 2 \
              --max-time 25 "$url" > "$RUNNER_TEMP/neighbor-preview.html"
            if grep -Fq 'Greily Molina' "$RUNNER_TEMP/neighbor-preview.html" \
              && grep -Fq 'Juan Carlos Ortega Rached' "$RUNNER_TEMP/neighbor-preview.html" \
              && grep -Fq 'Primera revisión dentro de 24 horas' "$RUNNER_TEMP/neighbor-preview.html" \
              && grep -Fq 'https://wa.me/' "$RUNNER_TEMP/neighbor-preview.html" \
              && grep -Fq 'noindex, nofollow' "$RUNNER_TEMP/neighbor-preview.html"; then
              echo "Verified updated neighbors page: $url"
              echo "### Cloudflare preview updated and verified" >> "$GITHUB_STEP_SUMMARY"
              echo "$url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Cloudflare preview does not yet match the deployed residents build."
          exit 1
